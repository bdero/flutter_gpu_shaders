name: Flutter CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
      - run: dart --version
      - run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Lint analysis
        run: dart analyze
      - name: Dart format
        run: dart format --output none --set-exit-if-changed $(find . -name '**.dart' -not -path '*/build/*')

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

  shader-bundle-smoke-master:
    name: Shader bundle smoke (master)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
      - run: flutter --version
      - name: Verify Flutter master shader bundle hook behavior
        run: tool/verify_shader_bundle_hook.sh
        env:
          VERIFY_BUILD_HOOK_CACHE: true
          VERIFY_DATA_ASSETS: true
          VERIFY_DIRECT_SHADER: true
          VERIFY_TRANSITIVE_INCLUDE: true

  shader-bundle-smoke-stable:
    name: Shader bundle smoke (stable)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - name: Verify Flutter stable shader bundle build compatibility
        run: tool/verify_shader_bundle_hook.sh
